# Local container stack — FRI-2004, ADR-050.
#
# Brings up a Friday Deployment the way the cloud will: the app as ONE
# container (supervisor PID 1 over daemon + zero-cache + dashboard) against an
# EXTERNAL Postgres. Postgres is a sibling service here rather than a process
# inside the app container, which is the same boundary ADR-050 draws — it just
# happens to live next door in dev.
#
# Deliberately NOT pointed at the host's `friday` database: zero-cache needs a
# logical replication slot, and a host zero-cache already holds one against the
# same publication. Two of them would fight over it.
#
#   docker compose up --build
#
# Then create an account to log in with (dev only, and not run on boot on
# purpose — an image that seeds a known account is a backdoor the moment it
# leaves a laptop):
#
#   docker compose exec -e FRIDAY_DEV_SEED=1 friday \
#     node packages/cli/scripts/dev-seed.mjs
#
# Defaults to dev@friday.test / friday-dev-password; override with
# FRIDAY_SEED_EMAIL / FRIDAY_SEED_PASSWORD / FRIDAY_SEED_NAME.
#
# The app will still refuse to serve until the Deployment role and the `vector`
# extension exist on the database — see FRI-2005, which moves that provisioning
# off the boot path for real. Until then `postgres.initdb` below does it once at
# first start, which is the same split the cloud will have (provisioning creates
# the extension with a superuser; the Deployment only verifies it).

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friday
    # wal_level=logical is a SERVER-level setting and zero-cache's logical
    # replication is dead without it (ADR-024). max_replication_slots is raised
    # off its default of 10 because each Deployment's zero-cache consumes one —
    # the ceiling ADR-051 flags for the shared-cluster arrangement.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    ports:
      - "5433:5432" # 5433 on the host so it cannot collide with a local Postgres
    volumes:
      # pg18 wants a single mount at /var/lib/postgresql (data then lives in a
      # subdirectory), so that `pg_upgrade --link` has no mount-point boundary
      # to cross. Mounting .../data directly makes the image refuse to start.
      - pgdata:/var/lib/postgresql
      - ./packaging/dev-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d friday"]
      interval: 3s
      timeout: 3s
      retries: 20

  # FRI-2011: a real hostname in front of the dashboard, so the cloud's
  # proxy-and-public-origin path is exercised in dev rather than discovered at
  # cutover. `*.localhost` resolves to 127.0.0.1 in browsers (RFC 6761 is
  # implemented client-side), so this needs no /etc/hosts entry — but the macOS
  # system resolver does NOT do it, so curl and scripts need
  # `--resolve friday.localhost:80:127.0.0.1`.
  #
  # BetterAuth derives absolute URLs, the CSRF origin check, and the session
  # cookie's `Secure`/`__Secure-` prefix from its baseURL — and hard-exits when
  # a configured public URL is not in trustedOrigins. Running behind a proxy
  # locally is the only way to find that before a Deployment does.
  proxy:
    image: caddy:2-alpine
    depends_on: [friday]
    ports:
      - "80:80"
    command: >-
      caddy reverse-proxy --from http://friday.localhost --to friday:7615

  friday:
    build: .
    # FRI-2006: run an init process (tini) as PID 1 in front of the supervisor.
    #
    # Node does not reap orphaned grandchildren. Measured: orphaning four
    # processes left four `Z` entries parented to PID 1, none collected — and
    # agent workers spawn detached, run build tools that fork, and are exactly
    # the thing that orphans. Over a long-lived Deployment that fills the
    # process table.
    #
    # Hand-rolling reaping in the supervisor would mean a SIGCHLD loop around
    # `waitpid(-1)` that has to not race the child bookkeeping it already does.
    # tini is the boring, correct version, and `docker run --init` is the same
    # thing — so the image stays runnable without compose doing anything special.
    #
    # Signal propagation is NOT the reason: that already works (a `docker stop`
    # completes in 0.6s, far inside the grace period), and tini forwards signals
    # to the supervisor unchanged.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # FRI-2004: the connection is configuration. `postgres` is the compose
      # service name — inside the container `localhost` is the container
      # itself, which is exactly the assumption this ticket removes.
      DATABASE_URL: postgresql://friday:friday@postgres:5432/friday
      # zero-cache replicates from the same database (ADR-024 keeps these in
      # sync; provisioning normally writes both).
      ZERO_UPSTREAM_DB: postgresql://friday:friday@postgres:5432/friday
      # FRIDAY_ADMIN_DATABASE_URL is deliberately NOT set here (FRI-2062).
      #
      # It is a SUPERUSER connection, and on the shared cluster ADR-051 plans
      # one superuser reaches every Organization's database. The daemon spawns
      # workers with `...process.env`, so anything set on this long-running
      # service is inherited by every builder — i.e. by the process that runs
      # untrusted repository code. That makes the Deployment container, which
      # FRI-2062 accepts as the isolation boundary, hold a credential reaching
      # straight past it.
      #
      # Nothing at runtime needs it: FRI-2005 moved `CREATE EXTENSION vector`
      # to provisioning, and the boot check (`hasVectorExtension`) is a
      # read-only `SELECT 1 FROM pg_extension` that runs as the application
      # role precisely so no superuser is required on the boot path.
      #
      # The one-off commands that DO need it — `friday restore`, provisioning —
      # take it per-invocation instead:
      #
      #   docker compose run --rm \
      #     -e FRIDAY_ADMIN_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres \
      #     --entrypoint node friday packages/cli/dist/index.js restore <bundle>
      #
      # The previous comment here stated this rule and then set the variable
      # anyway; see docs/sandbox.md § "Linux and containers".
      FRIDAY_DATA_DIR: /data
      # FRI-2014: the migrated `.env` carries the SOURCE machine's absolute
      # path here (`/Users/<someone>/.friday/zero/replica.db`), which does not
      # exist in a Deployment. zero-cache then exits with "Cannot open
      # ZERO_REPLICA_FILE", and because it is a supervised child the whole
      # stack goes down with it — a cutover failure that only appears AFTER a
      # restore, never on a fresh container.
      #
      # `loadFridayConfig` resolves machine-local keys as
      # `process.env[key] || parsed[key]`, so setting it here outranks the
      # bundle. Same shape as the DATABASE_URL precedence FRI-2013 added; any
      # other absolute host path in a migrated `.env` has the same hazard.
      # The replica is a cache, never canonical — it re-COPYs from Postgres.
      ZERO_REPLICA_FILE: /data/zero/replica.db
      # FRI-2060: agent credentials. Headless by necessity — the CLI's
      # subscription OAuth needs an interactive login and a persisted
      # credential dir, which an unattended Deployment cannot do. An API key
      # is also what BOTH arms of ADR-051's Capacity source reduce to
      # (`friday` = our org key, `byo` = the customer's), so dev and cloud
      # authenticate the same way. Unset here: export it in your shell, or put
      # it in the vault as ANTHROPIC_API_KEY.
      #
      # NULL value, not `${ANTHROPIC_API_KEY:-}`. The `:-` form sets the
      # variable to the EMPTY STRING when the host shell has not exported it,
      # and an empty string is not nullish — it shadows the key in
      # `$FRIDAY_DATA_DIR/.env` instead of falling back to it. The symptom is
      # not a missing-credential error at boot: the worker spawns, the SDK
      # reports `Not logged in · Please run /login`, and the daemon rewrites
      # that as an assistant block and retries forever. A null value is
      # resolved from the host environment and left UNSET when absent.
      ANTHROPIC_API_KEY:
      # FRI-2011: the public origin the browser actually uses. BetterAuth
      # generates cookies and redirects against this, and asserts it is a
      # trusted origin — so a mismatch fails loudly here instead of silently
      # 403-ing every sign-in in a Deployment.
      BETTER_AUTH_URL: http://friday.localhost
    ports:
      - "7615:7615"
    volumes:
      - friday-data:/data
      # SDK session transcripts live outside FRIDAY_DATA_DIR; without a volume
      # every Conversation silently starts fresh on each deploy (FRI-2007).
      - friday-home:/home/friday

volumes:
  pgdata:
  friday-data:
  friday-home:
